    }

    function mostrarEjercicio() {
      const contenedor = document.getElementById("contenedor-ejercicio");
      contenedor.innerHTML = "";

      if (indice >= preguntasActuales.length) {
        contenedor.innerHTML = `<h2>¡Terminaste los ejercicios!</h2><p>Puntos finales: ${puntos}</p><button onclick="reiniciar()">Volver</button>`;
        return;
      }

      const ejercicio = preguntasActuales[indice];
      const opcionesRandom = [...ejercicio.opciones].sort(() => Math.random() - 0.5);

      const preguntaElem = document.createElement("div");
      preguntaElem.className = "pregunta";
      preguntaElem.textContent = ejercicio.pregunta;
      contenedor.appendChild(preguntaElem);

      opcionesRandom.forEach(op => {
        const btn = document.createElement("div");
        btn.className = "opcion";
        btn.textContent = op;
        btn.onclick = () => verificarRespuesta(op, ejercicio.correcta);
        contenedor.appendChild(btn);
      });
    }

    function verificarRespuesta(respuesta, correcta) {
      if (respuesta === correcta) {
        puntos++;
      } else {
        puntos--;
      }

      if (puntos <= 0) {
        alert("¡Perdiste todos los puntos! Reiniciando ejercicios.");
        iniciarMateria(materiaActual);
        return;
      }

      document.getElementById("puntos").textContent = puntos;
      indice++;
      mostrarEjercicio();
    }

    function reiniciar() {
      document.getElementById("zona-juego").style.display = "none";
      document.getElementById("materias").style.display = "block";
    }
    function simularFoto(event) {
  const archivo = event.target.files[0];
  if (archivo) {
    const lector = new FileReader();
    lector.onload = function(e) {
      const img = document.getElementById('miniatura');
      img.src = e.target.result;
      img.style.display = 'block';
    };
    lector.readAsDataURL(archivo);

    alert("¡Foto tomada! Generando preguntas a partir de tus apuntes...");
    setTimeout(() => {
      alert("¡Listo! Ya puedes comenzar con tus ejercicios.");
    }, 2000);
  }
}
  </script>
